name: AntiLag v1.7.3 sync

on:
  push:
    paths:
      - '.github/workflows/antilag-sync-v173.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download v1.7.3 files from CDN
        run: |
          set -euo pipefail
          CURL=(curl --http1.1 --connect-timeout 15 --max-time 90 --retry 3 --retry-all-errors -fsSL)
          "${CURL[@]}" https://aka.doubaocdn.com/s/y95Zn7tVVn -o index.js
          "${CURL[@]}" https://aka.doubaocdn.com/s/PWL6Djbmci -o style.css
          "${CURL[@]}" https://aka.doubaocdn.com/s/QLtUfXAPZE -o manifest.json
          "${CURL[@]}" https://aka.doubaocdn.com/s/bNfacTfxpv -o README.md
          "${CURL[@]}" https://aka.doubaocdn.com/s/be6SUnJJHE -o antilag-1.7.3.zip

      - name: Commit release files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js style.css manifest.json README.md antilag-1.7.3.zip
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "release: AntiLag v1.7.3 [skip ci]"
            git push origin HEAD:main
          fi
