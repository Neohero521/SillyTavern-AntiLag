name: sync-v179
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and unpack v1.7.9
        run: |
          set -e
          url="https://aka.doubaocdn.com/s/m6N3vRzXUY"
          for i in 1 2 3; do
            if curl -L --max-time 90 -f "$url" -o /tmp/antilag.zip; then break; fi
            sleep 5
          done
          unzip -o /tmp/antilag.zip -d .
          grep -n "const VERSION" index.js | head -1
          grep -n '"version"' manifest.json | head -1
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js style.css manifest.json README.md
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m "chore: sync v1.7.9"
          git push
