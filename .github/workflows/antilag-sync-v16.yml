name: AntiLag sync v16
on:
  push:
    paths:
      - .github/workflows/antilag-sync-v16.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release files
        run: |
          set -e
          curl -fsSL "https://aka.doubaocdn.com/s/etQakVahjE" -o index.js
          curl -fsSL "https://aka.doubaocdn.com/s/aYVaDIEGzX" -o style.css
          curl -fsSL "https://aka.doubaocdn.com/s/34djcb1f19" -o manifest.json
          curl -fsSL "https://aka.doubaocdn.com/s/AFCnM3I9Zm" -o README.md
      - name: Commit and push
        run: |
          set -e
          git config user.name "Neohero521"
          git config user.email "109955134+Neohero521@users.noreply.github.com"
          git add index.js style.css manifest.json README.md
          git commit -m "release: AntiLag v1.6.0" || echo "no changes"
          git push origin HEAD:main
