name: Sync AntiLag v1.7.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/antilag-sync-v171.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download AntiLag files
        run: |
          set -eux
          curl -fL --http1.1 --connect-timeout 15 --max-time 90 --retry 3 --retry-all-errors -A 'Mozilla/5.0' 'https://aka.doubaocdn.com/s/8DiF4NZ2uS' -o index.js
          curl -fL --http1.1 --connect-timeout 15 --max-time 90 --retry 3 --retry-all-errors -A 'Mozilla/5.0' 'https://aka.doubaocdn.com/s/7YyCVDfv9P' -o style.css
          curl -fL --http1.1 --connect-timeout 15 --max-time 90 --retry 3 --retry-all-errors -A 'Mozilla/5.0' 'https://aka.doubaocdn.com/s/YXDdJThJzL' -o manifest.json
          curl -fL --http1.1 --connect-timeout 15 --max-time 90 --retry 3 --retry-all-errors -A 'Mozilla/5.0' 'https://aka.doubaocdn.com/s/FVgBQVGHw0' -o README.md
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.js style.css manifest.json README.md
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'chore: AntiLag v1.7.1'
            git push
          fi
