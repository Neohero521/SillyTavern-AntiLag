name: antilag sync v1.3.0
on:
  push:
    paths:
      - '.github/workflows/antilag-sync-v13.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch files from cdn
        run: |
          curl -fsSL 'https://aka.doubaocdn.com/s/t7G1qptHkX' -o index.js
          curl -fsSL 'https://aka.doubaocdn.com/s/5y1Vwt2lYX' -o style.css
          curl -fsSL 'https://aka.doubaocdn.com/s/yUQqLKzhpg' -o README.md
          curl -fsSL 'https://aka.doubaocdn.com/s/txO9b9Fd5P' -o manifest.json
          ls -l index.js style.css README.md manifest.json
      - name: commit and push
        run: |
          git config user.name 'Antilag Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add index.js style.css README.md manifest.json
          git commit -m 'chore: sync v1.3.0 files' || echo 'no changes'
          git push
