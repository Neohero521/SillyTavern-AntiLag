name: AntiLag sync v1.6.1

on:
  push:
    paths:
      - '.github/workflows/antilag-sync-v161.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download extension files
        run: |
          curl -fsSL 'https://aka.doubaocdn.com/s/gQ6lhkDjRn' -o index.js
          curl -fsSL 'https://aka.doubaocdn.com/s/Pli242XViK' -o style.css
          curl -fsSL 'https://aka.doubaocdn.com/s/LapUUGizsw' -o manifest.json
          curl -fsSL 'https://aka.doubaocdn.com/s/xSoJJgu0hf' -o README.md
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.js style.css manifest.json README.md
          git diff --staged --quiet || git commit -m 'chore: sync AntiLag v1.6.1'
          git push origin HEAD:main
