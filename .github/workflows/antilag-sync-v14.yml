name: antilag sync v1.4.0
on:
  push:
    paths:
      - '.github/workflows/antilag-sync-v14.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch files from cdn
        run: |
          curl -fsSL 'https://aka.doubaocdn.com/s/Dv0Hi0Ptxs' -o index.js
          curl -fsSL 'https://aka.doubaocdn.com/s/MA7eUsngAo' -o style.css
          curl -fsSL 'https://aka.doubaocdn.com/s/hV1JnS0kog' -o README.md
          curl -fsSL 'https://aka.doubaocdn.com/s/q1Ck64rhnm' -o manifest.json
          ls -l index.js style.css README.md manifest.json
      - name: commit and push
        run: |
          git config user.name 'Antilag Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add index.js style.css README.md manifest.json
          git commit -m 'chore: sync v1.4.0 files' || echo 'no changes'
          git push
