name: Sync AntiLag v1.9.0

on:
  push:
    paths:
      - '.github/workflows/antilag-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download package
        run: |
          curl -L --fail --retry 3 -o /tmp/antilag.zip "https://aka.doubaocdn.com/s/MAXFpVK6zC"
          unzip -l /tmp/antilag.zip

      - name: Apply package
        run: |
          rm -rf /tmp/antilag-extract && mkdir -p /tmp/antilag-extract
          unzip -o /tmp/antilag.zip -d /tmp/antilag-extract
          cp /tmp/antilag-extract/antilag/manifest.json ./manifest.json
          cp /tmp/antilag-extract/antilag/index.js ./index.js
          cp /tmp/antilag-extract/antilag/style.css ./style.css
          cp /tmp/antilag-extract/antilag/README.md ./README.md
          cp /tmp/antilag.zip ./antilag-1.9.0.zip

      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json index.js style.css README.md antilag-1.9.0.zip
          if git diff --cached --quiet; then
            echo 'No file changes'
          else
            git commit -m 'chore: release v1.9.0'
            git push
          fi

      - name: Remove workflow
        run: |
          git rm .github/workflows/antilag-sync.yml
          git commit -m 'chore: remove one-time sync workflow'
          git push
