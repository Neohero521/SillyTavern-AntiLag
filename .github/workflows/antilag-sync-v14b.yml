name: antilag sync v1.4.0 hotfix
on:
  push:
    paths:
      - '.github/workflows/antilag-sync-v14b.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch index from cdn
        run: |
          curl -fsSL 'https://aka.doubaocdn.com/s/0M1L4qDoI5' -o index.js
          ls -l index.js
      - name: commit and push
        run: |
          git config user.name 'Antilag Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add index.js
          git commit -m 'fix: restore stream fade on reset (v1.4.0)' || echo 'no changes'
          git push
